name: Backend CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/v0id-x/circle-chat-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/circlechat-vm-key
          chmod 600 ~/.ssh/circlechat-vm-key
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH
        run: |
          ssh \
            -i ~/.ssh/circlechat-vm-key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "echo SSH connection successful"

      - name: Deploy to Kubernetes
        run: |
          ssh \
            -i ~/.ssh/circlechat-vm-key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "sudo kubectl set image deployment/circlechat-backend backend=$IMAGE_NAME:${{ github.sha }} && sudo kubectl rollout status deployment/circlechat-backend --timeout=180s"