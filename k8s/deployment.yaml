apiVersion: apps/v1
kind: Deployment

metadata:
  name: circlechat-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: circlechat-backend

  template:
    metadata:
      labels:
        app: circlechat-backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/v0id-x/circle-chat-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - secretRef:
                name: circlechat-env

          env:
            - name: PORT
              value: "8000"

          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3